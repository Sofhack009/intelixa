# PostgreSQL. Versions 9.3 and up are supported.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>


development:
  <<: *default
  database: intelixa_development

test:
  <<: *default
  database: intelixa_test

production:
  primary: &primary_production
    <<: *default
    database: intelixa_production
    username: <%= ENV.fetch("DB_USERNAME", "intelixa") %>
    password: <%= ENV["INTELIXA_DATABASE_PASSWORD"] || ENV["DB_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: intelixa_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: intelixa_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: intelixa_production_cable
    migrations_paths: db/cable_migrate
