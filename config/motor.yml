- id: 2
  name: Overdue Job Work
  sql_body: "SELECT c.id as challan_id, jw.name as job_worker, c.expected_return_date,
    \n       DATE_PART('day', CURRENT_TIMESTAMP - c.expected_return_date) as days_overdue\nFROM
    job_work_challans c\nJOIN job_workers jw ON c.job_worker_id = jw.id\nWHERE c.status
    = 'Pending' AND c.expected_return_date < CURRENT_TIMESTAMP\nORDER BY days_overdue
    DESC"
  description:
  preferences:
    query_type: sql
    database: primary
