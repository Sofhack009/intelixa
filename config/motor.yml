queries:
- id: 1
  name: Low Stock Alerts
  sql_body: |-
    SELECT i.sku_code, i.name, i.min_stock_level, COALESCE(SUM(b.quantity), 0) as current_stock
    FROM items i
    LEFT JOIN inventory_batches b ON b.item_id = i.id
    GROUP BY i.id
    HAVING COALESCE(SUM(b.quantity), 0) < i.min_stock_level
    ORDER BY current_stock ASC
  description:
  preferences:
    query_type: sql
    database: primary
