  tags: []
  updated_at: 2026-07-20 12:49:35.307204000 +00:00
- id: 3
  name: Trading Inventory Value
  sql_body: |-
    SELECT i.name, SUM(b.quantity * b.unit_cost) as total_capital_locked
    FROM items i
    JOIN inventory_batches b ON b.item_id = i.id
    WHERE i.item_type = 'trading_product'
    GROUP BY i.name
